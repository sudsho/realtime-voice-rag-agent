services:
  agent:
    build: .
    image: voice-rag-agent:dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      LOG_FORMAT: json
      LOG_LEVEL: INFO
      CHROMA_DIR: /data/.chroma
      WARM_MODELS: "1"
    volumes:
      - chroma:/data/.chroma
      - ./data/sample_kb:/app/data/sample_kb:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 20s
      timeout: 5s
      retries: 3

volumes:
  chroma: {}
