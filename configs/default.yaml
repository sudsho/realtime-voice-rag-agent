app:
  name: voice-rag-agent
  log_level: INFO
  sample_rate: 16000

stt:
  model: small.en
  device: cpu
  compute_type: int8
  beam_size: 1
  vad_filter: true
  language: en

vad:
  threshold: 0.5
  min_silence_ms: 250
  min_speech_ms: 200
  pad_ms: 80

rag:
  chroma_dir: .chroma
  collection: support
  top_k: 6
  rerank_k: 3
  embed_model: text-embedding-3-small

llm:
  provider: openai
  model: gpt-4o-mini
  temperature: 0.1
  max_tokens: 256
  system_prompt: |
    You are a customer support agent. Answer using only the provided context.
    Keep answers under three sentences. If the context does not cover the
    question, say so plainly and offer to escalate.

tts:
  provider: openai
  voice: alloy
  format: pcm
  sample_rate: 24000

ws:
  host: 0.0.0.0
  port: 8000
  max_message_bytes: 1048576

aws:
  region: us-east-1
  ecs_cluster: voice-rag
  ecs_service: voice-rag-svc
